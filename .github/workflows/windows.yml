on:
  workflow_call:
  workflow_dispatch:

jobs:
  windows-x64:
    name: Windows x86_64
    runs-on: windows-2025
    env:
      # Docker image tag: windowsservercore-ltsc2025-qt6.10-64bit-1
      # Using digest for easier verification of the transparent build chain.
      # https://github.com/LibrePCB/docker-librepcb-dev/actions/runs/20745227440/job/59560845499
      IMAGE_DIGEST: f78cc56d8c863317e44d20ab5a14080e20c0f13af8cab20533d2a6437a2437c9
      LIBREPCB_BUILD_AUTHOR: "LibrePCB CI"
    steps:
      # Clone Repository
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # Restore Caches
      - id: restore_ccache
        name: Restore .ccache
        uses: actions/cache/restore@v5
        with:
          key: ccache-${{ github.job }}-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.job }}-${{ github.ref }}
            ccache-${{ github.job }}-refs/heads/master
            ccache-${{ github.job }}
          path: build/.ccache-dir

      - id: restore_cargo
        name: Restore .cargo
        uses: actions/cache/restore@v5
        with:
          key: cargo-${{ github.job }}-${{ hashFiles('libs/librepcb/**/Cargo.lock') }}-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            cargo-${{ github.job }}-${{ hashFiles('libs/librepcb/**/Cargo.lock') }}-${{ github.ref }}
            cargo-${{ github.job }}-${{ hashFiles('libs/librepcb/**/Cargo.lock') }}-refs/heads/master
            cargo-${{ github.job }}-${{ hashFiles('libs/librepcb/**/Cargo.lock') }}
            cargo-${{ github.job }}
          path: |
            ./build/.cargo-home/bin/
            ./build/.cargo-home/registry/index/
            ./build/.cargo-home/registry/cache/
            ./build/.cargo-home/git/db/
            ./build/cargo/
            ./libs/librepcb/rust-core/target/

      # Start Docker Container
      # Workaround for spurious job failures due to Docker error.
      # https://github.com/actions/runner-images/issues/13729
      - name: Start Docker Service
        run: |
          $dockerState = Get-Service -Name "docker"
          if ($dockerState.Status -ne "Running") {
            Start-Service -Name "docker"
          }

      - name: Start Docker Container
        run: >
          docker run -d -t --name ci -w C:/work
          -v ${{ github.workspace }}:C:/work
          -e OS="windows"
          -e ARCH="x86_64"
          -e LIBREPCB_BUILD_AUTHOR="LibrePCB CI"
          -e CI_BRANCH_NAME="${{ github.ref }}"
          -e CCACHE_DIR="C:/work/build/.ccache-dir"
          -e CCACHE_MAXSIZE="500MB"
          -e CARGO_HOME="C:/work/build/.cargo-home"
          -e CARGO_INCREMENTAL="0"
          "ghcr.io/librepcb/docker-librepcb-dev@sha256:${{ env.IMAGE_DIGEST }}"

      - name: Print Environment
        run: docker exec ci bash ./ci/print_environment.sh

      # Install Dependencies
      - name: Install Python Packages
        run: >
          docker exec
          -e UV_INDEX_SLINT_PRIVATE_USERNAME="${{ secrets.UV_INDEX_SLINT_PRIVATE_USERNAME }}"
          -e UV_INDEX_SLINT_PRIVATE_PASSWORD="${{ secrets.UV_INDEX_SLINT_PRIVATE_PASSWORD }}"
          ci bash ./ci/install_python_packages.sh

      - name: Print New Environment  # Print again since it has been modified
        run: docker exec ci bash ./ci/print_environment.sh

      # Build
      - id: build
        name: Build LibrePCB
        run: docker exec ci bash ./ci/build_librepcb.sh

      - name: Build Archive
        run: docker exec ci bash ./ci/build_windows_archive.sh

      - name: Build Installer
        run: docker exec ci bash ./ci/build_windows_installer.sh

      # Create portable ZIP from produced portable directory
      - name: Create Portable ZIP
        if: ${{ always() && (steps.build.outcome == 'success') && (!cancelled()) }}
        run: >
          docker exec ci bash -lc
          "set -euo pipefail;
          export PATH='/usr/bin:$PATH';
          mkdir -p ./artifacts/nightly_builds;
          PORTABLE_DIR='./artifacts/nightly_builds/librepcb-nightly-windows-x86_64';
          ZIP_PATH='./artifacts/nightly_builds/librepcb-portable-nightly-windows-x86_64.zip';
          test -d \"$PORTABLE_DIR\";
          rm -f \"$ZIP_PATH\";
          cd ./artifacts/nightly_builds;
          7z a -tzip -mx=9 \"librepcb-portable-nightly-windows-x86_64.zip\" \"librepcb-nightly-windows-x86_64\";
          ls -la \"./librepcb-portable-nightly-windows-x86_64.zip\""

      # Upload Artifacts (run even if tests failed, but only if build succeeded)
      - name: Tar Artifacts
        run: docker exec ci bash ./ci/tar_artifacts.sh
        if: ${{ always() && (steps.build.outcome == 'success') && (!cancelled()) }}

      - name: Upload Artifacts
        run: >
          docker exec
          -e UPLOAD_URL="${{ secrets.UPLOAD_URL }}"
          -e UPLOAD_USER="${{ secrets.UPLOAD_USER }}"
          -e UPLOAD_PASS="${{ secrets.UPLOAD_PASS }}"
          -e UPLOAD_SIGN_KEY="${{ secrets.UPLOAD_SIGN_KEY }}"
          ci bash ./ci/upload_artifacts.sh
        if: ${{ always() && (steps.build.outcome == 'success') && (!cancelled()) }}
        env:
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}  # Required to use it in 'if' condition

      - name: Debug artifact tree
        if: ${{ always() && (steps.build.outcome == 'success') && (!cancelled()) }}
        shell: pwsh
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          if (Test-Path "artifacts") {
            Get-ChildItem -Path artifacts -Recurse | Select-Object FullName
          } else {
            Write-Host "artifacts/ does not exist"
          }

      - name: Create Portable ZIP (host)
        if: ${{ always() && (steps.build.outcome == 'success') && (!cancelled()) }}
        shell: pwsh
        run: |
          $src = "artifacts/nightly_builds/librepcb-nightly-windows-x86_64"
          $dst = "artifacts/nightly_builds/librepcb-portable-nightly-windows-x86_64.zip"

          if (-not (Test-Path $src)) {
            Write-Error "Portable source directory not found: $src"
            exit 1
          }

          if (Test-Path $dst) { Remove-Item $dst -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $dst -CompressionLevel Optimal
          Get-Item $dst | Format-List FullName,Length,LastWriteTime

      - name: Upload Portable Zip Package Artifact
        uses: actions/upload-artifact@v7
        if: ${{ always() && (steps.build.outcome == 'success') && (!cancelled()) }}
        with:
          name: librepcb-portable-windows-x86_64
          path: artifacts/nightly_builds/librepcb-portable-nightly-windows-x86_64.zip
          if-no-files-found: error

      - name: Upload Installer EXE Artifact
        uses: actions/upload-artifact@v7
        if: ${{ always() && (steps.build.outcome == 'success') && (!cancelled()) }}
        with:
          name: librepcb-installer-windows-x86_64
          path: artifacts/nightly_builds/librepcb-installer-nightly-windows-x86_64.exe
          if-no-files-found: error

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: ${{ always() && (steps.build.outcome == 'success') && (!cancelled()) }}
        with:
          name: ${{ github.job }}
          if-no-files-found: ignore
          path: |
            libs/librepcb/rust-core/target/llvm-cov/html/
            tests/ui/screenshot.png

      # Save Caches
      - name: Cache .ccache
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.restore_ccache.outputs.cache-primary-key }}
          path: build/.ccache-dir
        if: ${{ always() && steps.restore_ccache && (!cancelled()) }}

      - name: Cache .cargo
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.restore_cargo.outputs.cache-primary-key }}
          path: |
            ./build/.cargo-home/bin/
            ./build/.cargo-home/registry/index/
            ./build/.cargo-home/registry/cache/
            ./build/.cargo-home/git/db/
            ./build/cargo/
            ./libs/librepcb/rust-core/target/
        if: ${{ always() && steps.restore_cargo && (!cancelled()) }}
